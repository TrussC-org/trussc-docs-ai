<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrussC docs-chat demo</title>
<style>
body { max-width: 850px; margin: 3rem auto; padding: 1rem; background: #111; color: #eee; font: 16px system-ui; }
form { display: flex; gap: .5rem; } input { flex: 1; } input,button { padding: .8rem; }
#answer,.filler { white-space: pre-wrap; } .research { color: #a9b1ff; margin-bottom: 1rem; }
#answer { margin: 1rem 0; } a { color: #a9b1ff; }
</style>
<h1>TrussC docs-chat</h1>
<p id="status">checking server…</p>
<form id="form"><input id="question" aria-label="Question" required><button id="send">Send</button></form>
<div id="research" aria-live="polite"></div>
<div id="answer" aria-live="polite"></div>
<div id="links"></div>
<script>
// Standalone dev harness. The production site widget is maintained in trussc.org.
const $ = (id) => document.getElementById(id);
const lang = (navigator.language || 'en').slice(0, 2);
const researchLabel = (queries) => ({
    ja: `🔎 「${queries.join(' / ')}」で再検索中…`,
    ko: `🔎 「${queries.join(' / ')}」로 다시 검색 중…`,
    en: `🔎 Searching again for “${queries.join(' / ')}”…`,
}[lang] || `🔎 Searching again for “${queries.join(' / ')}”…`);
fetch('/health').then(r => r.json()).then(j => { $('status').textContent = j.ok ? `server online · ${j.chunks} chunks` : 'server offline'; })
    .catch(() => { $('status').textContent = 'server offline'; });
$('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    if ($('send').disabled) return;
    $('question').disabled = $('send').disabled = true;
    $('answer').textContent = ''; $('research').textContent = ''; $('links').textContent = '';
    let completed = false;
    function receive(type, data) {
        if (type === 'research') {
            const round = document.createElement('div'); round.className = 'research';
            const filler = document.createElement('div'); filler.className = 'filler'; filler.textContent = data.message;
            const status = document.createElement('div'); status.textContent = `${data.round}: ${researchLabel(data.queries)}`;
            round.append(filler, status); $('research').append(round);
        } else if (type === 'token') $('answer').textContent += data;
        else if (type === 'replace') $('answer').textContent = data;
        else if (type === 'links') {
            $('links').textContent = '';
            for (const link of data) {
                const a = document.createElement('a'); a.href = link.url; a.textContent = link.label; a.style.marginRight = '1rem'; $('links').append(a);
            }
        } else if (type === 'done') completed = true;
        else if (type === 'error') throw new Error(data);
    }
    try {
        const response = await fetch('/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: $('question').value }) });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const reader = response.body.getReader(), decoder = new TextDecoder(); let pending = '';
        while (true) {
            const { done, value } = await reader.read(); if (done) break;
            pending += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
            let end;
            while ((end = pending.indexOf('\n\n')) >= 0) {
                const lines = pending.slice(0, end).split('\n'); pending = pending.slice(end + 2);
                const type = lines.find(l => l.startsWith('event: '))?.slice(7);
                const data = lines.filter(l => l.startsWith('data: ')).map(l => l.slice(6)).join('\n');
                if (type && data) receive(type, JSON.parse(data));
            }
        }
        if (!completed) throw new Error('Stream ended before the answer completed');
    } catch (error) { $('answer').textContent += `\n${error.message}`; }
    finally { $('question').disabled = $('send').disabled = false; $('question').focus(); }
});
</script>
</html>
